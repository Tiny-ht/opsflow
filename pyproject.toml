[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opsflow"
version = "0.2.0"
description = "A bounded, dependency-free project ops CLI with track cards, safe ledgers, and incremental search."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tiny-ht" }]
dependencies = []

[project.scripts]
opsflow = "opsflow.cli:main"

[tool.setuptools]
packages = ["opsflow"]
